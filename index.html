<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Examinations.ie</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            /* background-attachment: fixed is buggy/janky on iOS Safari during scroll,
               so this uses "scroll" instead. Looks identical on desktop. */
            background: url('images/Wallpaper.jpg') no-repeat center center scroll;
            background-size: cover;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin: 20px 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
        }

        .hero-image {
            width: 100%;
            overflow: hidden;
        }
        .hero-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Toolbar: search + sort. Sticky so it's reachable one-thumb on a tablet
           without scrolling back up. */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .toolbar input[type="search"],
        .toolbar select {
            /* 16px minimum stops iOS Safari from auto-zooming on focus */
            font-size: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            -webkit-appearance: none;
            appearance: none;
            min-height: 44px; /* comfortable tap target */
        }

        .toolbar input[type="search"] {
            flex: 1 1 220px;
            min-width: 0;
        }

        .toolbar select {
            flex: 0 0 auto;
        }

        .toolbar .result-count {
            color: #aaa;
            font-size: 14px;
            flex: 0 0 auto;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .game-card {
            position: relative;
            text-align: center;
            background: rgba(0,0,0,0.9);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .game-card:hover,
        .game-card:active {
            transform: scale(1.05);
        }

        .game-card a {
            display: block;
        }

        .game-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #222;
        }

        .game-card p {
            margin-top: 10px;
            font-weight: bold;
            color: #fff;
        }

        .warn-badge {
            display: none;
            position: absolute;
            top: 6px;
            right: 6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e2453c;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            cursor: default;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: #ddd;
            font-size: 18px;
            padding: 40px 0;
        }

        @media (max-width: 480px) {
            .toolbar {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<div class="hero-image">
    <img src="images/Banner.png" alt="Johnny Games Hero Image">
</div>

<div class="toolbar">
    <input type="search" id="searchInput" placeholder="Search games..." aria-label="Search games">
    <select id="sortSelect" aria-label="Sort games">
        <option value="asc">Name: A &rarr; Z</option>
        <option value="desc">Name: Z &rarr; A</option>
    </select>
    <span class="result-count" id="resultCount"></span>
</div>

<div class="game-grid" id="gameGrid">
    <p class="empty-msg">Loading games...</p>
</div>

<script>
(function () {
    'use strict';

    // Tiny gray placeholder so a missing thumbnail doesn't leave a broken-image icon.
    const FALLBACK_THUMB =
        'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">' +
            '<rect width="220" height="220" fill="#2a2a2a"/>' +
            '<text x="50%" y="50%" fill="#888" font-family="Arial" font-size="14" ' +
            'text-anchor="middle" dominant-baseline="middle">no thumbnail</text></svg>'
        );

    // Extensions to try, in order, when a manifest entry doesn't specify one explicitly.
    const THUMB_EXTENSIONS = ['png', 'jpg', 'jpeg'];

    const grid = document.getElementById('gameGrid');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const resultCount = document.getElementById('resultCount');

    const state = {
        games: [],          // normalized {name, html, thumb, external}
        checks: new Map(),  // name -> {thumbOk, htmlOk}
        badgeEls: new Map(),// name -> badge element currently in the DOM
        search: '',
        sortDir: 'asc'
    };

    function normalize(entry) {
        const name = entry.name;
        const isExternal = !!entry.url;
        // If the manifest explicitly names a thumbnail file, trust it as-is (single try).
        // Otherwise build a list of candidates to try in order: name.png, name.jpg, name.jpeg.
        const thumbCandidates = entry.thumb
            ? [entry.thumb]
            : THUMB_EXTENSIONS.map(ext => 'thumbnails/' + name + '.' + ext);
        return {
            name: name,
            html: isExternal ? entry.url : ('games/' + name + '.html'),
            thumbCandidates: thumbCandidates,
            external: isExternal
        };
    }

    async function checkHtml(url) {
        try {
            let res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
            if (res.status === 405 || res.status === 501) {
                // Some static hosts reject HEAD requests; fall back to a GET.
                res = await fetch(url, { method: 'GET', cache: 'no-store' });
            }
            return res.ok;
        } catch (e) {
            return false;
        }
    }

    function markCheck(name, key, value) {
        const existing = state.checks.get(name) || {};
        existing[key] = value;
        state.checks.set(name, existing);
        updateBadge(name);
    }

    function updateBadge(name) {
        const badge = state.badgeEls.get(name);
        if (!badge) return;
        const c = state.checks.get(name) || {};
        const missing = [];
        if (c.thumbOk === false) missing.push('thumbnail');
        if (c.htmlOk === false) missing.push('game file');
        if (missing.length) {
            badge.style.display = 'flex';
            badge.title = 'Missing ' + missing.join(' and ');
        } else {
            badge.style.display = 'none';
        }
    }

    function getFilteredSorted() {
        const q = state.search.trim().toLowerCase();
        let list = state.games.filter(g => g.name.toLowerCase().includes(q));
        list.sort((a, b) => {
            const cmp = a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
            return state.sortDir === 'asc' ? cmp : -cmp;
        });
        return list;
    }

    function render() {
        const list = getFilteredSorted();
        grid.innerHTML = '';
        state.badgeEls.clear();
        resultCount.textContent = list.length + (list.length === 1 ? ' game' : ' games');

        if (list.length === 0) {
            const msg = document.createElement('p');
            msg.className = 'empty-msg';
            msg.textContent = 'No games match your search.';
            grid.appendChild(msg);
            return;
        }

        for (const g of list) {
            const card = document.createElement('div');
            card.className = 'game-card';

            const link = document.createElement('a');
            link.href = g.html;
            if (g.external) {
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
            }

            const img = document.createElement('img');
            img.alt = g.name;
            img.loading = 'lazy';

            let candidateIndex = 0;
            const tryNextThumb = () => {
                if (candidateIndex >= g.thumbCandidates.length) {
                    img.src = FALLBACK_THUMB;
                    markCheck(g.name, 'thumbOk', false);
                    return;
                }
                img.src = g.thumbCandidates[candidateIndex++];
            };
            img.addEventListener('error', tryNextThumb);
            img.addEventListener('load', function onLoad() {
                if (img.src.indexOf('data:image/svg') === -1) {
                    markCheck(g.name, 'thumbOk', true);
                }
            });
            tryNextThumb();

            link.appendChild(img);
            card.appendChild(link);

            const caption = document.createElement('p');
            caption.textContent = g.name;
            card.appendChild(caption);

            const badge = document.createElement('div');
            badge.className = 'warn-badge';
            badge.textContent = '!';
            badge.setAttribute('aria-hidden', 'true');
            card.appendChild(badge);
            state.badgeEls.set(g.name, badge);

            grid.appendChild(card);

            // Only run the HTML existence check once per game, not on every re-render.
            if (!g.external && !state.checks.has(g.name)) {
                checkHtml(g.html).then(ok => markCheck(g.name, 'htmlOk', ok));
            } else {
                updateBadge(g.name);
            }
        }
    }

    searchInput.addEventListener('input', () => {
        state.search = searchInput.value;
        render();
    });

    sortSelect.addEventListener('change', () => {
        state.sortDir = sortSelect.value;
        render();
    });

    fetch('games.json', { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            state.games = data.map(normalize);
            render();
        })
        .catch(err => {
            grid.innerHTML = '<p class="empty-msg">Could not load games.json. ' +
                'Make sure it sits next to index.html.</p>';
            console.error(err);
        });
})();
</script>

</body>
</html>

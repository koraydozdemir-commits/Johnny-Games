<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Johnny Games Web</title><style>:root{--bg:#070711;--panel:#101021;--line:#30304d;--text:#f7f7ff;--muted:#a7a7c4;--accent:#7656ff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.bar{height:64px;display:flex;align-items:center;gap:7px;padding:10px;border-bottom:1px solid var(--line);background:#080811}.brand{font-weight:900;white-space:nowrap}.brand span{display:block;font-size:9px;color:var(--muted);letter-spacing:1.5px}.nav{display:flex;gap:5px}.nav button,button{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer;padding:0 11px}.nav button{width:38px;padding:0}.form{display:flex;gap:7px;flex:1;min-width:0}.url{min-width:0;flex:1;height:40px;border:1px solid var(--line);border-radius:10px;background:#030308;color:#fff;padding:0 13px;outline:none}.url:focus{border-color:var(--accent)}.go{background:#7656ff;border-color:#7656ff;font-weight:800}.view{height:calc(100% - 64px);overflow:auto;background:white}.status{position:fixed;left:12px;bottom:12px;padding:7px 10px;border:1px solid var(--line);background:#080811ef;border-radius:9px;color:var(--muted);font-size:11px;z-index:5}@media(max-width:650px){.brand{display:none}.bar{padding:8px}.nav button{width:34px}.status{display:none}}</style></head><body><header class="bar"><div class="brand">JOHNNY GAMES<span>WEB</span></div><div class="nav"><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button></div><form class="form" id="form"><input class="url" id="url" placeholder="Enter a website address or search" autocomplete="off" spellcheck="false"><button class="go">Go</button></form><button id="home">⌂</button></header><main id="view" class="view"></main><div id="status" class="status">Ready</div><script>(()=>{const $=x=>document.getElementById(x),HOME='https://example.com/';const PROXY_BASE='/proxy?url=';let history=[],pos=-1,current='';function normalize(v){v=v.trim();if(!v)return HOME;if(/^[a-z][a-z0-9+.-]*:\/\//i.test(v))return v;if(/^[^\s]+\.[^\s]+$/.test(v))return'https://'+v;return'https://www.google.com/search?q='+encodeURIComponent(v)}function proxy(u){return PROXY_BASE+encodeURIComponent(u)}function rewrite(el,attr,base){const v=el.getAttribute(attr);if(!v||v.startsWith('#')||/^(data|blob|javascript|mailto|tel):/i.test(v))return;try{el.setAttribute(attr,proxy(new URL(v,base).href))}catch{}}async function load(u,push=true){current=u;$('url').value=u;$('status').textContent='Loading…';try{const r=await fetch(proxy(u),{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('[href]').forEach(e=>rewrite(e,'href',u));doc.querySelectorAll('[src]').forEach(e=>rewrite(e,'src',u));doc.querySelectorAll('form[action]').forEach(e=>rewrite(e,'action',u));$('view').innerHTML='';$('view').append(...Array.from(doc.body?.childNodes||[]));$('view').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();if(a.href)load(a.href,true)});$('view').querySelectorAll('form').forEach(form=>form.onsubmit=e=>{e.preventDefault();load(new URL(form.action||u,u).href,true)});if(push){history.splice(pos+1);history.push(u);pos=history.length-1}$('status').textContent='Proxy: '+new URL(u).hostname}catch(e){$('view').innerHTML='<div style="padding:40px;font:16px system-ui;color:#222"><h2>Unable to load this site</h2><p>'+e.message+'</p><p>This site may require browser features beyond a basic HTTP proxy.</p></div>';$('status').textContent='Request failed'}}$('form').onsubmit=e=>{e.preventDefault();load(normalize($('url').value))};$('back').onclick=()=>{if(pos>0){pos--;load(history[pos],false)}};$('forward').onclick=()=>{if(pos<history.length-1){pos++;load(history[pos],false)}};$('reload').onclick=()=>load(current,false);$('home').onclick=()=>load(HOME);load(HOME)})();</script></body></html>

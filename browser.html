<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Johnny Games Browser</title><style>
:root{--bg:#070711;--line:#353554;--text:#f7f7ff;--muted:#a8a8c7;--accent:#7c5cff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.top{height:64px;display:flex;gap:8px;align-items:center;padding:10px;background:#070711;border-bottom:1px solid var(--line)}.brand{font-weight:900;white-space:nowrap}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.5px}.nav{display:flex;gap:6px}.address{display:flex;gap:8px;flex:1;min-width:100px}button,input{font:inherit}button{height:40px;border:1px solid var(--line);border-radius:10px;background:#18182b;color:var(--text);padding:0 12px;cursor:pointer}.nav button{width:40px;padding:0}.address input{flex:1;min-width:0;border:1px solid #40405c;border-radius:11px;background:#04040c;color:#fff;padding:0 13px;outline:0}.address input:focus{border-color:var(--accent)}.go{background:linear-gradient(135deg,#7656ff,#3c9cff);font-weight:800}#frame{width:100%;height:calc(100% - 64px);border:0;background:#fff;display:block}.hint{position:fixed;left:12px;bottom:12px;background:#070711ef;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--muted);font-size:11px}@media(max-width:700px){.brand{display:none}.top{padding:8px}.nav button{width:36px}.hint{display:none}}</style></head><body>
<header class="top"><div class="brand">JOHNNY GAMES<small>BROWSER</small></div><div class="nav"><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button></div><form class="address" id="form"><input id="url" autocomplete="off" spellcheck="false" placeholder="Enter a website or search…"><button class="go">Go</button></form><button id="open">↗</button><button id="home">⌂</button></header><iframe id="frame" title="Johnny Games Browser"></iframe><div class="hint" id="hint"></div>
<script>
(()=>{const $=id=>document.getElementById(id),HOME='https://www.google.com/';
// Configure this after deploying your proxy backend.
// Example: const PROXY_BASE='https://proxy.example.com/?url=';
const PROXY_BASE='';let current=HOME,stack=[],pos=-1;
function norm(v){v=v.trim();if(!v)return HOME;if(/^[a-z][a-z0-9+.-]*:\/\//i.test(v))return v;if(/^[^\s]+\.[^\s]+$/.test(v))return'https://'+v;return'https://www.google.com/search?q='+encodeURIComponent(v)}
function target(v){return PROXY_BASE?PROXY_BASE+encodeURIComponent(v):v}
function load(v,p){current=v;$('url').value=v;$('frame').src=target(v);if(p){stack.splice(pos+1);stack.push(v);pos=stack.length-1}$('hint').textContent=PROXY_BASE?'Proxy mode active.':'Direct mode — configure PROXY_BASE for proxy mode.'}
$('form').onsubmit=e=>{e.preventDefault();load(norm($('url').value),true)};$('open').onclick=()=>window.open(current,'_blank','noopener,noreferrer');$('home').onclick=()=>load(HOME,false);$('reload').onclick=()=>load(current,false);$('back').onclick=()=>{if(pos>0){pos--;load(stack[pos],false)}};$('forward').onclick=()=>{if(pos<stack.length-1){pos++;load(stack[pos],false)}};load(HOME,true)})();
</script></body></html>

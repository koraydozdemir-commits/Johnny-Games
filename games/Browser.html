<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Johnny Browser</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:#eee;overflow:hidden}
#bar{height:58px;display:flex;gap:8px;align-items:center;padding:9px;background:#1b1b1b;border-bottom:1px solid #333}
button{height:38px;min-width:38px;border:1px solid #444;border-radius:8px;background:#292929;color:#eee;font-size:16px;cursor:pointer}
button:hover{background:#363636}
#url{flex:1;height:38px;border:1px solid #444;border-radius:8px;background:#101010;color:#eee;padding:0 12px;font-size:15px;outline:none}
#url:focus{border-color:#777}
#frame{display:block;width:100%;height:calc(100% - 58px);border:0;background:white}
#status{position:fixed;left:10px;bottom:10px;padding:5px 9px;border-radius:6px;background:#111d;color:#bbb;font-size:12px;display:none}
</style>
</head>
<body>
<div id="bar">
  <button id="back" title="Back">←</button>
  <button id="forward" title="Forward">→</button>
  <button id="reload" title="Reload">↻</button>
  <input id="url" type="text" autocomplete="off" spellcheck="false"
         placeholder="Enter a website or search...">
  <button id="go" title="Go">Go</button>
  <button id="newtab" title="Open in new tab">↗</button>
  <button id="home" title="Home">⌂</button>
</div>

<iframe id="frame" title="Browser"></iframe>
<div id="status"></div>

<script>
(() => {
  const frame = document.getElementById('frame');
  const url = document.getElementById('url');
  const status = document.getElementById('status');

  const HOME = 'https://www.google.com/';
  let current = HOME;

  function normalize(value) {
    value = value.trim();
    if (!value) return HOME;

    // Looks like a domain or URL.
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return value;
    if (/^(localhost|(\d{1,3}\.){3}\d{1,3})(:\d+)?(\/.*)?$/i.test(value))
      return 'http://' + value;
    if (/^[^\s]+\.[^\s]+$/i.test(value))
      return 'https://' + value;

    // Otherwise search.
    return 'https://www.google.com/search?q=' + encodeURIComponent(value);
  }

  function showStatus(text) {
    status.textContent = text;
    status.style.display = 'block';
    clearTimeout(showStatus.timer);
    showStatus.timer = setTimeout(() => status.style.display = 'none', 2500);
  }

  function load(value, push = true) {
    const target = normalize(value);
    current = target;
    url.value = target;

    if (push) history.pushState({url: target}, '', '#');
    frame.src = target;
  }

  document.getElementById('go').onclick = () => load(url.value);
  url.addEventListener('keydown', e => {
    if (e.key === 'Enter') load(url.value);
  });

  document.getElementById('reload').onclick = () => {
    try { frame.contentWindow.location.reload(); }
    catch (_) { frame.src = current; }
  };

  document.getElementById('home').onclick = () => load(HOME);

  document.getElementById('newtab').onclick = () => {
    window.open(current, '_blank', 'noopener,noreferrer');
  };

  document.getElementById('back').onclick = () => {
    try {
      frame.contentWindow.history.back();
    } catch (_) {
      showStatus('Back is unavailable for this page.');
    }
  };

  document.getElementById('forward').onclick = () => {
    try {
      frame.contentWindow.history.forward();
    } catch (_) {
      showStatus('Forward is unavailable for this page.');
    }
  };

  frame.addEventListener('load', () => {
    try {
      url.value = frame.contentWindow.location.href;
      current = frame.contentWindow.location.href;
    } catch (_) {
      // Cross-origin pages intentionally cannot expose their URL to the parent.
    }
  });

  load(HOME, false);
})();
</script>
</body>
</html>

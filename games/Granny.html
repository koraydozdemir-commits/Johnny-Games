<html lang="en-us">
<head>
    <title>Granny Original</title>

    <!-- GameMonetize SDK Entegrasyonu -->
    <script type="text/javascript">
        window.SDK_OPTIONS = {
            gameId: "jp112o3o4hzgrnc7zaewjkrfk282pul8",
            onEvent: function (a) {
                switch (a.name) {
                    case "SDK_GAME_PAUSE":
                        console.log("Oyun duraklatıldı, ses kapatılıyor...");
                        if (typeof myGameInstance !== 'undefined' && myGameInstance) {
                            myGameInstance.SendMessage('AudioManager', 'MuteAudio');
                        }
                        break;
                    case "SDK_GAME_START":
                        console.log("Reklam bitti, oyun devam ediyor...");
                        if (typeof myGameInstance !== 'undefined' && myGameInstance) {
                            myGameInstance.SendMessage('AudioManager', 'UnmuteAudio');
                        }
                        break;
                    case "SDK_READY":
                        console.log("SDK hazır.");
                        break;
                }
            }
        };
        (function (a, b, c) {
            var d = a.getElementsByTagName(b)[0];
            a.getElementById(c) || (a = a.createElement(b), a.id = c, a.src = "https://cdn.jsdelivr.net/gh/testamalame/sef@main/sedk.js", d.parentNode.insertBefore(a, d));
        })(document, "script", "gamemonetize-sdk");
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: url('https://cdn.jsdelivr.net/gh/gru6nny/ohd@main/background.png') no-repeat center center fixed;
            background-size: cover;
        }
        #unity-container {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
        }
        #unity-loading-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffffff;
            border-radius: 10px;
            display: block;
        }
        #unity-logo {
            position: absolute;
            top: calc(50% - 100px);
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: auto;
        }
        #unity-logo img {
            max-width: 100%;
            height: auto;
        }
        #unity-progress-bar-empty {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #unity-progress-bar-full {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: #4caf50;
            border-radius: 8px;
            transition: width 0.3s ease;
        }
        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translate(-50%);
            background: white;
            padding: 10px;
            display: none;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" style="position: absolute; width: 100%; height: 100%"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo">
            </div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>
    <script>
        async function mergeUnityWebFiles(baseUrl, filePrefix, totalParts, extension) {
            const partUrls = [];
            for (let i = 1; i <= totalParts; i++) {
                partUrls.push(`${baseUrl}/${filePrefix}_part${i}.${extension}`);
            }

            const buffers = [];
            for (let i = 0; i < totalParts; i++) {
                const response = await fetch(partUrls[i]);
                if (!response.ok) {
                    throw new Error(`Failed to load part: ${partUrls[i]}`);
                }
                const buffer = await response.arrayBuffer();
                buffers.push(buffer);

                const progress = ((i + 1) / totalParts) * 100;
                document.querySelector("#unity-progress-bar-full").style.width = `${progress}%`;
            }

            const totalLength = buffers.reduce((acc, buffer) => acc + buffer.byteLength, 0);
            const combinedBuffer = new Uint8Array(totalLength);
            let offset = 0;

            buffers.forEach((buffer) => {
                combinedBuffer.set(new Uint8Array(buffer), offset);
                offset += buffer.byteLength;
            });

            return combinedBuffer;
        }

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        let myGameInstance = null;
        let isAdShown = false;

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        function showAdOnClick() {
            if (!isAdShown && typeof sdk !== 'undefined' && typeof sdk.showBanner !== 'undefined') {
                sdk.showBanner();
                isAdShown = true;
            }
        }

        var buildUrl = "https://cdn.jsdelivr.net/gh/gru6nny/ohd@main/Build";
        var loaderUrl = buildUrl + "/Granny.loader.js";

        async function initializeGame() {
            try {
                const dataBuffer = await mergeUnityWebFiles(buildUrl, "Granny", 2, "data");
                const wasmBuffer = await mergeUnityWebFiles(buildUrl, "Granny", 2, "wasm");

                const dataBlobUrl = URL.createObjectURL(new Blob([dataBuffer], { type: "application/octet-stream" }));
                const wasmBlobUrl = URL.createObjectURL(new Blob([wasmBuffer], { type: "application/octet-stream" }));

                var config = {
                    dataUrl: dataBlobUrl,
                    frameworkUrl: buildUrl + "/Granny.framework.js",
                    codeUrl: wasmBlobUrl,
                    streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/gru6nny/ohd@main/StreamingAssets",
                    companyName: "Anastasia Kazantseva",
                    productName: "Granny",
                    productVersion: "1.0",
                    showBanner: unityShowBanner,
                };

                var script = document.createElement("script");
                script.src = loaderUrl;
                script.onload = () => {
                    createUnityInstance(canvas, config, (progress) => {
                        progressBarFull.style.width = 100 * progress + "%";
                    }).then((unityInstance) => {
                        myGameInstance = unityInstance;
                        loadingBar.style.display = "none";
                        // Oyun yüklendiğinde tıklama olayını ekle
                        canvas.addEventListener('pointerdown', showAdOnClick);
                        canvas.addEventListener('touchstart', showAdOnClick);
                    }).catch((message) => {
                        alert(message);
                    });
                };

                document.body.appendChild(script);
            } catch (error) {
                console.error("Game initialization failed:", error);
            }
        }

        initializeGame();
    </script>
    <style>
  #vjoy-base {
    position: fixed;
    left: 24px;
    bottom: 24px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    touch-action: none;
    z-index: 999999;
    display: none;
  }
  #vjoy-stick {
    position: absolute;
    left: 35px;
    top: 35px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    pointer-events: none;
  }
  /* Only show this on touch-primary devices, leaves desktop untouched */
  @media (pointer: coarse) {
    #vjoy-base { display: block; }
  }
</style>

<div id="vjoy-base"><div id="vjoy-stick"></div></div>

<script>
(function () {
  'use strict';

  // Change this to 'wasd' if the game uses WASD instead of arrow keys.
  var KEY_SCHEME = 'arrows';

  var SCHEMES = {
    arrows: {
      up:    { key: 'ArrowUp',    code: 'ArrowUp',    keyCode: 38 },
      down:  { key: 'ArrowDown',  code: 'ArrowDown',  keyCode: 40 },
      left:  { key: 'ArrowLeft',  code: 'ArrowLeft',  keyCode: 37 },
      right: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 }
    },
    wasd: {
      up:    { key: 'w', code: 'KeyW', keyCode: 87 },
      down:  { key: 's', code: 'KeyS', keyCode: 83 },
      left:  { key: 'a', code: 'KeyA', keyCode: 65 },
      right: { key: 'd', code: 'KeyD', keyCode: 68 }
    }
  };
  var keys = SCHEMES[KEY_SCHEME];

  var base = document.getElementById('vjoy-base');
  var stick = document.getElementById('vjoy-stick');
  var activeDirs = {};
  var touchId = null;

  function fireKey(type, dir) {
    var k = keys[dir];
    if (!k) return;
    var opts = {
      key: k.key, code: k.code, keyCode: k.keyCode, which: k.keyCode,
      bubbles: true, cancelable: true
    };
    // Fire on every plausible listener target. Different engines (Unity/Emscripten,
    // Ruffle/Flash, GameMaker, Defold) attach keyboard listeners in different places,
    // so we cover document, window, the canvas, and a ruffle-player if present.
    var targets = [document, window];
    var canvas = document.querySelector('canvas');
    if (canvas) targets.push(canvas);
    var ruffle = document.querySelector('ruffle-player');
    if (ruffle) targets.push(ruffle);
    for (var i = 0; i < targets.length; i++) {
      targets[i].dispatchEvent(new KeyboardEvent(type, opts));
    }
  }

  function setDirections(newDirs) {
    var dir;
    for (dir in activeDirs) {
      if (activeDirs[dir] && !newDirs[dir]) fireKey('keyup', dir);
    }
    for (dir in newDirs) {
      if (newDirs[dir] && !activeDirs[dir]) fireKey('keydown', dir);
    }
    activeDirs = newDirs;
  }

  function handleMove(clientX, clientY) {
    var rect = base.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = clientX - cx;
    var dy = clientY - cy;
    var maxDist = rect.width / 2;
    var rawDist = Math.hypot(dx, dy);
    var dist = Math.min(rawDist, maxDist);
    var angle = Math.atan2(dy, dx);

    stick.style.left = (35 + Math.cos(angle) * dist - 15) + 'px';
    stick.style.top = (35 + Math.sin(angle) * dist - 15) + 'px';

    var newDirs = {};
    var deadzone = maxDist * 0.25;
    if (rawDist > deadzone) {
      var deg = angle * 180 / Math.PI;
      if (deg > -135 && deg < -45) newDirs.up = true;
      else if (deg > 45 && deg < 135) newDirs.down = true;
      if (deg > 135 || deg < -135) newDirs.left = true;
      else if (deg > -45 && deg < 45) newDirs.right = true;
    }
    setDirections(newDirs);
  }

  function reset() {
    stick.style.left = '35px';
    stick.style.top = '35px';
    setDirections({});
  }

  base.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    touchId = t.identifier;
    handleMove(t.clientX, t.clientY);
  }, { passive: false });

  base.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === touchId) handleMove(t.clientX, t.clientY);
    }
  }, { passive: false });

  base.addEventListener('touchend', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === touchId) {
        touchId = null;
        reset();
      }
    }
  }, { passive: false });
})();
</script>
</body>

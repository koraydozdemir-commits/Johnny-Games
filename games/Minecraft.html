<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111820">
<title>Minecraft Classic · Johnny Games</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none}
#stage{position:fixed;inset:0;background:#111820;display:flex;align-items:center;justify-content:center}
#canvas{display:block;width:100%;height:100%;border:0;padding:0;background:#000;outline:0;touch-action:none}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;max-width:min(90vw,520px);padding:16px 20px;border:1px solid #ffffff2b;border-radius:14px;background:#111820ed;text-align:center;box-shadow:0 14px 50px #0009;font-size:14px;line-height:1.5}
#status strong{display:block;font-size:18px;margin-bottom:6px}
#status small{display:block;color:#b8c5ce;margin-top:7px}
#status.hidden{display:none}
#logmsg{position:fixed;left:10px;bottom:8px;z-index:4;color:#fff;background:#111820b8;padding:5px 8px;border-radius:7px;font-size:11px;max-width:90vw;pointer-events:none}
#home{position:fixed;right:10px;top:10px;z-index:8;border:1px solid #ffffff40;background:#111820d9;color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;text-decoration:none;font-size:13px;backdrop-filter:blur(8px)}
@media(orientation:landscape){#home{top:max(10px,env(safe-area-inset-top))}}
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas></div>
<div id="status"><strong>Loading Minecraft Classic…</strong>Starting the ClassiCube browser client.<small>On iPad, rotate to landscape for the best controls. First load may take a little while.</small></div>
<div id="logmsg" aria-live="polite">Preparing game…</div>
<a id="home" href="../index.html">← Johnny Games</a>
<script>
(function(){
  'use strict';
  var status=document.getElementById('status');
  var log=document.getElementById('logmsg');
  var canvas=document.getElementById('canvas');
  function setStatus(message){
    log.textContent=String(message||'');
    if(/all downloads complete|running|ready/i.test(String(message||''))) status.classList.add('hidden');
  }
  function fail(message){
    status.classList.remove('hidden');
    status.innerHTML='<strong>Could not start Minecraft Classic</strong><span>'+String(message||'The browser client failed to load.')+'</span><small>Refresh the page or try again in Safari with a stable connection.</small>';
  }
  // The upstream webclient expects its stock texture pack at /static/default.zip.
  // Rewrite only that one asset request to the project's published texture pack.
  var texturePack='https://classicube.net/static/default.zip';
  var nativeOpen=XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open=function(method,url){
    if(typeof url==='string' && /(^|\/)static\/default\.zip(?:[?#].*)?$/.test(url)) url=texturePack;
    return nativeOpen.apply(this,[method,url].concat([].slice.call(arguments,2)));
  };
  if(window.fetch){
    var nativeFetch=window.fetch.bind(window);
    window.fetch=function(input,init){
      var url=typeof input==='string'?input:(input&&input.url)||'';
      if(/(^|\/)static\/default\.zip(?:[?#].*)?$/.test(url)) input=texturePack;
      return nativeFetch(input,init);
    };
  }
  window.Module={
    preRun:[],
    postRun:[],
    arguments:['JohnnyGames'],
    print:function(){var s=Array.prototype.slice.call(arguments).join(' ');console.log(s);},
    printErr:function(){var s=Array.prototype.slice.call(arguments).join(' ');console.error(s);},
    canvas:canvas,
    setStatus:setStatus,
    totalDependencies:0,
    monitorRunDependencies:function(left){
      this.totalDependencies=Math.max(this.totalDependencies,left);
      setStatus(left?'Preparing game… ('+(this.totalDependencies-left)+'/'+this.totalDependencies+')':'All downloads complete.');
    }
  };
  window.addEventListener('error',function(event){
    if(event && event.message) fail(event.message);
  });
  window.addEventListener('unhandledrejection',function(event){
    fail(event.reason&&event.reason.message?event.reason.message:'A game resource failed to load.');
  });
  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.floor(canvas.clientWidth*dpr));
    canvas.height=Math.max(1,Math.floor(canvas.clientHeight*dpr));
  }
  window.addEventListener('resize',resize,{passive:true});
  resize();
  var script=document.createElement('script');
  script.src='https://cs.classicube.net/client/latest/ClassiCube.js';
  script.async=true;
  script.onerror=function(){fail('The ClassiCube client could not be downloaded. Check your connection and refresh.');};
  document.head.appendChild(script);
})();
</script>
</body>
</html>

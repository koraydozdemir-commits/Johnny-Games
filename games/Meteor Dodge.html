<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Meteor Dodge — Johnny Games</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,Arial;background:#090b16;color:#fff;overflow:hidden}main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at top,#1b2140,#090b16 65%);text-align:center}h1{font-size:clamp(24px,5vw,42px);margin:0 0 8px}p{color:#c4c7db;margin:0 0 16px}.stats{display:flex;gap:22px;margin-bottom:16px;font-weight:700}.arena{position:relative;width:min(92vw,680px);height:min(55vh,420px);min-height:230px;border:2px solid #38bdf8;border-radius:18px;background:rgba(255,255,255,.04);overflow:hidden;box-shadow:0 0 28px #38bdf833}.target{position:absolute;width:62px;height:62px;border:0;border-radius:50%;background:#38bdf8;color:#101020;font-size:26px;font-weight:900;box-shadow:0 0 20px #38bdf899;touch-action:manipulation;cursor:pointer}.start{border:0;border-radius:12px;padding:13px 24px;font-weight:800;font-size:16px;background:#38bdf8;color:#101020;cursor:pointer}.hint{font-size:13px;margin-top:12px;color:#a7abc5}
</style></head><body><main><h1>Meteor Dodge</h1><p>Johnny Games original arcade challenge</p><div class="stats"><span>Score: <b id="score">0</b></span><span>Time: <b id="time">20</b>s</span><span>Best: <b id="best">0</b></span></div><div class="arena" id="arena"><button class="target" id="target" aria-label="Hit target" style="display:none">✦</button></div><div style="height:14px"></div><button class="start" id="start">Start Game</button><div class="hint">Tap the glowing target as many times as you can before time runs out.</div></main><script>
(()=>{const arena=document.querySelector('#arena'),target=document.querySelector('#target'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),start=document.querySelector('#start');let score=0,time=20,timer=null,playing=false;let best=0;try{best=+(localStorage.getItem('jg_best_4')||0)}catch(e){}bestEl.textContent=best;
function move(){const maxX=Math.max(0,arena.clientWidth-target.offsetWidth),maxY=Math.max(0,arena.clientHeight-target.offsetHeight);target.style.left=Math.floor(Math.random()*(maxX+1))+'px';target.style.top=Math.floor(Math.random()*(maxY+1))+'px';}
function end(){playing=false;clearInterval(timer);target.style.display='none';start.style.display='inline-block';start.textContent='Play Again';start.disabled=false;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('jg_best_4',best)}catch(e){}}}
start.onclick=()=>{clearInterval(timer);score=0;time=20;scoreEl.textContent=score;timeEl.textContent=time;playing=true;target.style.display='block';start.style.display='none';move();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end()},1000)};
target.onclick=()=>{if(!playing)return;score++;scoreEl.textContent=score;move()};window.addEventListener('resize',()=>{if(playing)move()});
})();
</script></body></html>

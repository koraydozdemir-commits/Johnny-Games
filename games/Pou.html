<meta name="apple-mobile-web-app-capable" content="yes">

<title>Pou</title>

<link rel="apple-touch-icon" type="image/png" href="../icons/icon_40x40.png">
<link rel="stylesheet" href="assets/css/app.css">
<style>
html,body{width:100%;height:100%;height:100dvh;margin:0;padding:0;overflow:hidden!important;background:#000;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:pan-x pan-y}
#content{position:absolute;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;touch-action:manipulation}
#content canvas,#content iframe,#content video{max-width:100%;max-height:100%;touch-action:none}
#orientation{position:fixed;inset:0;z-index:9999;pointer-events:none}
#pou-loader-error{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:24px;background:#080808;color:#fff;font:16px/1.5 system-ui,-apple-system,sans-serif;text-align:center}
#pou-loader-error.show{display:flex}
#pou-loader-error button{display:block;margin:18px auto 0;padding:12px 22px;border:0;border-radius:10px;background:#fff;color:#111;font:700 15px system-ui}
</style>
</head>
<body>
<div id="content"></div>
<div id="orientation"></div>
<div id="pou-loader-error" role="alert">
  <div>
    <strong>Pou couldn't start.</strong>
    <p>The game server may be taking too long to respond. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</div>
<script>
(function(){
'use strict';
var error=document.getElementById('pou-loader-error');
var failed=false;
var timeout=setTimeout(showError,25000);
function showError(){if(failed)return;failed=true;error.classList.add('show');}
function loadScript(url,onload,onerror){
  var s=document.createElement('script');
  s.src=url;
  s.async=true;
  s.onload=function(){if(onload)onload();};
  s.onerror=function(){s.remove();if(onerror)onerror();};
  document.body.appendChild(s);
}
var _azerionIntegration={
  gdId:"d1362abc246f43bdb5c26643aec2b61b",
  advType:"gd",
  alxType:"std",
  af:false,
  sa:false,
  la:false,
  bd:0,
  playBtn:true,
  cp:false
};
var libs=[];
var azDefaultLanguage;
var gameName="https://cdn.jsdelivr.net/gh/greeniYT/clever@gh-pages/pou.min.js";
function startGame(){
  loadScript(gameName+"?v="+encodeURIComponent(window.version||Date.now()),function(){
    clearTimeout(timeout);
    error.classList.remove('show');
  },showError);
}
loadScript("https://cdn.jsdelivr.net/gh/greeniYT/clever@gh-pages/version.js?v="+Date.now(),startGame,function(){
  // Retry the same pinned game files through jsDelivr's alternate edge hostname.
  loadScript("https://fastly.jsdelivr.net/gh/greeniYT/clever@gh-pages/version.js?v="+Date.now(),startGame,showError);
});
})();
</script>
</body>

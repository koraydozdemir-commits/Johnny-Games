<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#07070f;color:#fff;font:17px -apple-system,Arial,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,7,15,.94);padding:20px;text-align:center;z-index:5}
.scr[hidden]{display:none}
h1{margin:0;font-size:44px;letter-spacing:3px}
input{font-size:20px;min-height:48px;padding:0 14px;border-radius:12px;border:2px solid #333a5c;background:#12142a;color:#fff;text-align:center;width:240px;-webkit-user-select:text;user-select:text}
button{min-height:48px;padding:0 24px;border-radius:12px;border:0;background:#6c4cff;color:#fff;font:700 18px inherit;font-family:inherit}
button.g{background:#2a2f55}button:disabled{opacity:.35}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#code{font-size:48px;letter-spacing:8px;font-weight:800;color:#8fe3ff}
.pl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
.chip{padding:8px 14px;border-radius:20px;font-weight:700;border:2px solid #fff3}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;display:none;justify-content:space-between;pointer-events:none;z-index:2;font-weight:700;text-shadow:0 1px 3px #000}
#bar{height:10px;width:200px;background:#222;border-radius:5px;overflow:hidden;margin-top:6px}#bar i{display:block;height:100%;width:0;background:#4ade80}
#btns{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:12px;z-index:3}
#btns button{width:100px;min-height:48px;font-size:14px;box-shadow:0 5px 18px #0008;border:1px solid #ffffff22}#btns{gap:8px}#vent{background:#64748b}#sab{background:#7c3aed}#fx{position:fixed;inset:0;pointer-events:none;z-index:4;display:none;align-items:center;justify-content:center;font-size:clamp(28px,7vw,64px);font-weight:1000;letter-spacing:4px;text-shadow:0 5px 25px #000;animation:pop .7s ease both}@keyframes pop{0%{opacity:0;transform:scale(1.5)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#kill{background:#e11d48}#rep{background:#f59e0b;color:#000}
#hold{position:fixed;left:50%;bottom:90px;width:200px;margin-left:-100px;height:12px;background:#222;border-radius:6px;overflow:hidden;display:none;z-index:3}#hold i{display:block;height:100%;width:0;background:#8fe3ff}
#vote .chip{min-width:200px;font-size:18px;background:#12142a;border-color:#6c4cff}

#taskpanel{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:#050914cc;padding:16px;touch-action:manipulation}
#taskcard{width:min(520px,100%);background:linear-gradient(145deg,#263650,#101a2b);border:2px solid #829bbd;border-radius:18px;padding:20px;box-shadow:0 22px 70px #000b;text-align:center;color:#f4f8ff}
#taskcard h2{margin:0 0 6px;font-size:25px;letter-spacing:1px;text-shadow:0 0 18px #7dd3fc66}#taskcard{position:relative;overflow:hidden}#taskcard:before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#38bdf8,#a78bfa,#38bdf8);background-size:200% 100%;animation:scan 3s linear infinite}@keyframes scan{to{background-position:200% 0}}.tasktile{box-shadow:inset 0 1px 0 #ffffff22,0 5px 12px #0005;transition:transform .12s,filter .12s}.tasktile:active,.wire:active{transform:scale(.94);filter:brightness(1.25)}#taskdesc{color:#b9c9dc;margin:0 0 18px;font-size:14px}
#taskarea{min-height:190px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.tasktile{min-width:58px;min-height:58px;border:2px solid #ffffff66;border-radius:12px;background:#344967;color:white;font-size:22px;font-weight:800;padding:10px;touch-action:manipulation}
.tasktile:disabled{opacity:.45}.taskstatus{min-height:24px;color:#a9eaff;margin:10px 0}
.taskclose{background:#53647c!important;margin-top:8px}
.wirecol{display:flex;flex-direction:column;gap:10px}.wire{width:46px;height:46px;border-radius:50%;border:3px solid #fff9;min-width:46px;padding:0}
#aligntrack{width:min(360px,90%);height:28px;background:#101827;border:2px solid #8ca4c5;border-radius:20px;position:relative;overflow:hidden}
#alignzone{position:absolute;left:42%;width:16%;height:100%;background:#22c55e88;border-left:2px solid #86efac;border-right:2px solid #86efac}
#alignneedle{position:absolute;left:0;top:0;width:5px;height:100%;background:#fff;box-shadow:0 0 8px #fff}
.settinggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.settinggrid label{display:flex;flex-direction:column;gap:5px;color:#aabbd2;font-size:13px}.settinggrid select{width:100%;min-height:42px;padding:6px;border:1px solid #526582;border-radius:9px;background:#202e45;color:white;font:inherit}#lobby{overflow-y:auto;justify-content:flex-start;padding-top:22px;padding-bottom:22px}@media(max-width:420px){.settinggrid{grid-template-columns:1fr}#lobby{gap:10px}}</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><div>Role: <span id="role"></span><div id="tl" style="font-weight:400;font-size:14px;margin-top:4px"></div></div><div>Tasks<div id="bar"><i></i></div></div></div>
<div id="hold"><i></i></div>
<div id="taskpanel" role="dialog" aria-modal="true" aria-labelledby="tasktitle"><div id="taskcard"><h2 id="tasktitle">TASK</h2><p id="taskdesc"></p><div id="taskarea"></div><div class="taskstatus" id="taskstatus" aria-live="polite"></div><button class="taskclose" id="taskcancel">CANCEL</button></div></div>
<div id="btns"><button id="use">USE</button><button id="rep">REPORT</button><button id="kill">KILL</button><button id="vent">VENT</button><button id="sab">SABOTAGE</button></div><div id="fx"></div>

<div class="scr" id="home">
 <h1>VOID CREW</h1><div style="color:#9aa">Find the saboteur before they get you.</div>
 <input id="nm" maxlength="10" placeholder="Your name" autocomplete="off">
 <div class="row"><button id="host">Host game</button></div>
 <input id="jc" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off">
 <button id="join" class="g">Join with code</button>
 <div id="err" style="color:#fb7185;min-height:22px"></div><div id="connectstate" style="min-height:20px;color:#a9c7e8;font-size:13px"></div>
 <div style="color:#667;font-size:13px;max-width:380px">Needs internet. 3 or more players. Everyone opens the same page.</div>
</div>
<div class="scr" id="lobby" hidden>
 <div>Join code</div><div id="code"></div>
 <div class="pl" id="plist"></div><div id="lmsg" style="color:#9aa"></div><section id="roomsettings" style="display:none;width:min(560px,100%);padding:14px;border:1px solid #39496c;border-radius:14px;background:#111a2b;text-align:left"><h3>ROOM SETTINGS · HOST ONLY</h3><div class="settinggrid"><label>Impostors<select id="cfgImps"><option value="1">1</option><option value="2">2</option></select></label><label>Speed<select id="cfgSpeed"><option value=".8">Slow</option><option value="1" selected>Normal</option><option value="1.25">Fast</option><option value="1.5">Very fast</option></select></label><label>Kill cooldown<select id="cfgCooldown"><option value="8000">8 sec</option><option value="12000" selected>12 sec</option><option value="18000">18 sec</option><option value="25000">25 sec</option></select></label><label>Tasks per crewmate<select id="cfgTasks"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></label></div></section><button id="start" hidden>Start game</button>
</div>
<div class="scr" id="vote" hidden><h2 id="vt" style="margin:0"></h2><div id="vopts" class="row" style="max-width:640px"></div><div id="vtime"></div></div>
<div class="scr" id="end" hidden><h1 id="et"></h1><div id="es" style="color:#9aa"></div><button id="again" hidden>Back to lobby</button></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){'use strict';
var $=function(i){return document.getElementById(i)};
var COL=['#ef4444','#3b82f6','#22c55e','#eab308','#ec4899','#f97316','#a855f7','#14b8a6','#e5e7eb','#84cc16'];
var W=1600,H=1000,SPD=200,R=18,KR=90,KCD=12000;
var WALLS=[[520,0,20,140],[520,260,20,140],[0,380,140,20],[260,380,260,20]];
WALLS=WALLS.concat(WALLS.map(function(w){return[W-w[0]-w[2],H-w[1]-w[3],w[2],w[3]]}),WALLS.map(function(w){return[W-w[0]-w[2],w[1],w[2],w[3]]}),WALLS.map(function(w){return[w[0],H-w[1]-w[3],w[2],w[3]]}));
var ST=[[200,180],[1400,180],[200,820],[1400,820],[800,120],[800,880]],TBL=[800,500];
var VENTS=[[540,180],[1060,180],[540,820],[1060,820]],PANELS=[[690,390],[910,610]];
var ambience=Array.from({length:54},function(_,i){return{x:(i*347)%W,y:(i*613)%H,r:1+(i%3),phase:i*.73}});
var CH='ABCDEFGHJKLMNPQRSTUVWXYZ';

var isHost=false,peer,conns={},hostConn,me='me',connectTimer=null,connectBusy=false;
var roomCfg={imps:1,speed:1,cooldown:12000,tasks:3};
var P={};            // id -> {name,col}
var C={phase:'home',pos:{},bodies:[],done:0,total:0,role:'',tasks:[],mine:{},meet:null};
var HS=null;         // host sim state
var inp={x:0,y:0},killAt=0,ventAt=0,sabAt=0,killFx=null;

function show(id){['home','lobby','vote','end'].forEach(function(s){$(s).hidden=s!==id})}
function err(t){$('err').textContent=t}
function stopConnectTimer(){if(connectTimer){clearTimeout(connectTimer);connectTimer=null}}
function resetConnection(message){
 stopConnectTimer();connectBusy=false;
 try{if(hostConn){hostConn.close();hostConn=null}}catch(e){}
 try{if(peer){peer.destroy();peer=null}}catch(e){}
 $('host').disabled=$('join').disabled=false;
 $('connectstate').textContent='';if(message)err(message);
}
function beginConnect(message,ms,fail){
 connectBusy=true;$('host').disabled=$('join').disabled=true;err('');$('connectstate').textContent=message;
 stopConnectTimer();connectTimer=setTimeout(function(){if(connectBusy)resetConnection(fail)},ms);
}
function readRoomCfg(){
 roomCfg={imps:Number($('cfgImps').value)||1,speed:Number($('cfgSpeed').value)||1,cooldown:Number($('cfgCooldown').value)||12000,tasks:Number($('cfgTasks').value)||3};
}
['cfgImps','cfgSpeed','cfgCooldown','cfgTasks'].forEach(function(id){$(id).addEventListener('change',function(){readRoomCfg();if(isHost)bcast({t:'lobby',P:P,cfg:roomCfg})})});

/* ---------- networking ---------- */
function toHost(m){if(isHost)handle(me,m);else if(hostConn&&hostConn.open)hostConn.send(m)}
function bcast(m){Object.keys(conns).forEach(function(k){if(conns[k].open)conns[k].send(m)});onMsg(m)}
function sendTo(id,m){if(id===me)onMsg(m);else if(conns[id]&&conns[id].open)conns[id].send(m)}
function nm(){return($('nm').value.trim()||'Crew').slice(0,10)}

$('host').onclick=function(){
 if(connectBusy)return;
 if(!window.Peer)return err('Could not load PeerJS (network blocked?)');
 readRoomCfg();var code='';for(var i=0;i<4;i++)code+=CH[Math.random()*CH.length|0];
 beginConnect('Creating room…',12000,'Room creation timed out. Check your connection and try again.');
 try{peer=new Peer('vcrew-'+code,{debug:0});}catch(e){resetConnection('Could not start networking. Please try again.');return}
 peer.on('error',function(e){resetConnection(e.type==='unavailable-id'?'That room code was taken. Please host again.':'Network error ('+e.type+'). Please try again.')});
 peer.on('open',function(){
  stopConnectTimer();connectBusy=false;$('host').disabled=$('join').disabled=false;$('connectstate').textContent='';
  isHost=true;me='host';P={host:{name:nm(),col:COL[0]}};$('code').textContent=code;
  show('lobby');lobbyUI();bcast({t:'lobby',P:P,cfg:roomCfg});
  peer.on('connection',function(c){
   c.on('data',function(m){handle(c.peer,m)});
   c.on('open',function(){conns[c.peer]=c});
   c.on('close',function(){delete conns[c.peer];if(P[c.peer]){delete P[c.peer];if(HS&&HS.p[c.peer]){delete HS.p[c.peer];if(HS.phase==='play')checkWin()}else if(C.phase==='lobby'){bcast({t:'lobby',P:P,cfg:roomCfg})}}});
  });
 });
};
$('join').onclick=function(){
 if(connectBusy)return;
 var code=$('jc').value.trim().toUpperCase();if(code.length!==4)return err('Enter the 4 letter code');
 if(!window.Peer)return err('Could not load PeerJS (network blocked?)');
 beginConnect('Connecting to PeerJS…',18000,'Connection timed out. Check the code, then try again.');
 try{peer=new Peer({debug:0});}catch(e){resetConnection('Could not start networking. Please try again.');return}
 peer.on('error',function(e){resetConnection((e.type==='peer-unavailable'?'No room found with that code.':'Network error ('+e.type+').')+' Please try again.')});
 peer.on('open',function(){
  $('connectstate').textContent='Contacting room host…';
  try{hostConn=peer.connect('vcrew-'+code,{reliable:true});}catch(e){resetConnection('Could not contact the host. Try again.');return}
  hostConn.on('open',function(){stopConnectTimer();connectBusy=false;$('host').disabled=$('join').disabled=false;$('connectstate').textContent='';hostConn.send({t:'join',name:nm()});show('lobby');$('code').textContent=code});
  hostConn.on('data',onMsg);
  hostConn.on('error',function(){resetConnection('Connection to the room failed. Try again.')});
  hostConn.on('close',function(){if(C.phase==='lobby'||C.phase==='home')resetConnection('The room connection closed. Check the code and try again.');else{alert('Host left the game');location.reload()}});
 });
};

/* ---------- host logic ---------- */
function handle(id,m){
 if(m.t==='join'){
  if(C.phase!=='lobby'&&!(isHost&&HS==null))return;
  var n=Object.keys(P).length;if(n>=10)return;
  var used=Object.keys(P).map(function(k){return P[k].col});
  P[id]={name:m.name,col:COL.filter(function(c){return used.indexOf(c)<0})[0]};sendTo(id,{t:'welcome',id:id});
  bcast({t:'lobby',P:P,cfg:roomCfg});return;
 }
 if(!HS)return;var p=HS.p[id];if(!p)return;
 if(m.t==='in'){p.ix=m.x;p.iy=m.y}
 else if(m.t==='do'&&HS.phase==='play'&&p.alive&&p.role==='crew'&&p.tasks.indexOf(m.id)>-1&&p.done.indexOf(m.id)<0&&d(p,ST[m.id])<80){
  p.done.push(m.id);HS.done++;sendTo(id,{t:'td',id:m.id});if(HS.done>=HS.total)endGame('crew')}
 else if(m.t==='kill'&&HS.phase==='play'&&p.alive&&p.role==='imp'&&Date.now()>p.cd){
  var best=null,bd=KR;Object.keys(HS.p).forEach(function(k){var q=HS.p[k];if(q.alive&&q.role==='crew'&&d(p,q)<bd){bd=d(p,q);best=k}});
  if(best){var q=HS.p[best];q.alive=false;HS.bodies.push({id:best,x:q.x,y:q.y});bcast({t:'killfx',x:q.x,y:q.y,col:P[best].col});p.x=q.x;p.y=q.y;p.cd=Date.now()+HS.cfg.cooldown;sendTo(id,{t:'cd',until:p.cd});if(!checkWin())return}}
 else if(m.t==='vent'&&HS.phase==='play'&&p.alive&&p.role==='imp'&&Date.now()>p.vcd){var vi=-1;for(var z=0;z<VENTS.length;z++)if(d(p,{x:VENTS[z][0],y:VENTS[z][1]})<62){vi=z;break}if(vi>-1){var nv=VENTS[(vi+1)%VENTS.length];p.x=nv[0];p.y=nv[1];p.vcd=Date.now()+6500;sendTo(id,{t:'ventcd',until:p.vcd});bcast({t:'ventfx',x:p.x,y:p.y})}}
 else if(m.t==='sab'&&HS.phase==='play'&&p.alive&&p.role==='imp'&&Date.now()>p.scd){HS.sabotageUntil=Date.now()+16000;HS.repairs={};p.scd=Date.now()+28000;bcast({t:'sabotage',until:HS.sabotageUntil});sendTo(id,{t:'sabcd',until:p.scd})}
 else if(m.t==='repair'&&HS.phase==='play'&&p.alive&&p.role==='crew'&&HS.sabotageUntil>Date.now()){var pi=Number(m.panel);if((pi===0||pi===1)&&d(p,{x:PANELS[pi][0],y:PANELS[pi][1]})<75){HS.repairs=HS.repairs||{};HS.repairs[pi]=1;if(HS.repairs[0]&&HS.repairs[1]){HS.sabotageUntil=0;HS.repairs={};bcast({t:'repaired'})}}}
 else if(m.t==='rep'&&HS.phase==='play'&&p.alive&&HS.bodies.some(function(b){return d(p,b)<110}))startMeet(id,'body');
 else if(m.t==='meet'&&HS.phase==='play'&&p.alive&&!p.usedMeet&&d(p,{x:TBL[0],y:TBL[1]})<110){p.usedMeet=1;startMeet(id,'table')}
 else if(m.t==='vote'&&HS.phase==='meet'&&p.alive&&HS.votes[id]==null){HS.votes[id]=m.v;bcast({t:'voted',id:id});
  if(Object.keys(HS.p).every(function(k){return!HS.p[k].alive||HS.votes[k]!=null}))tally()}
}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
$('start').onclick=function(){
 var ids=Object.keys(P);if(ids.length<3)return;
 readRoomCfg();if(roomCfg.imps>=ids.length){$('lmsg').textContent='There must be more crew than impostors.';return}
 HS={phase:'play',p:{},bodies:[],done:0,total:0,votes:{},t:0,cfg:Object.assign({},roomCfg)};
 var shuffled=ids.slice().sort(function(){return Math.random()-.5}),imps=shuffled.slice(0,roomCfg.imps);
 ids.forEach(function(k,i){
  var a=i/ids.length*Math.PI*2,tl=[0,1,2,3,4,5].sort(function(){return Math.random()-.5}).slice(0,roomCfg.tasks),isImp=imps.indexOf(k)>-1;
  HS.p[k]={x:TBL[0]+Math.cos(a)*70,y:TBL[1]+Math.sin(a)*70,ix:0,iy:0,alive:true,role:isImp?'imp':'crew',tasks:isImp?[]:tl,done:[],cd:Date.now()+roomCfg.cooldown,vcd:0,scd:0,usedMeet:0};
  if(!isImp)HS.total+=roomCfg.tasks;
 });
 ids.forEach(function(k){sendTo(k,{t:'role',role:HS.p[k].role,tasks:HS.p[k].tasks,total:HS.total,P:P,cooldown:HS.cfg.cooldown})});
 clearInterval(HS.t);HS.t=setInterval(tick,50);
};
function tick(){
 if(!HS||HS.phase!=='play')return;
 Object.keys(HS.p).forEach(function(k){var p=HS.p[k];if(!p.alive)return;var l=Math.hypot(p.ix,p.iy);if(l>1){p.ix/=l;p.iy/=l}
  move(p,p.ix*SPD*HS.cfg.speed*.05,p.iy*SPD*HS.cfg.speed*.05)});
 bcast({t:'st',p:Object.keys(HS.p).map(function(k){var p=HS.p[k];return[k,p.x|0,p.y|0,p.alive?1:0,p.role==='imp'&&HS.bodies.length&&0?1:0]}),b:HS.bodies,dn:HS.done});
}
function move(p,dx,dy){
 p.x=Math.max(R,Math.min(W-R,p.x+dx));if(hit(p))p.x=Math.max(R,Math.min(W-R,p.x-dx));
 p.y=Math.max(R,Math.min(H-R,p.y+dy));if(hit(p))p.y=Math.max(R,Math.min(H-R,p.y-dy));
}
function hit(p){return WALLS.some(function(w){var cx=Math.max(w[0],Math.min(p.x,w[0]+w[2])),cy=Math.max(w[1],Math.min(p.y,w[1]+w[3]));return Math.hypot(p.x-cx,p.y-cy)<R})}
function startMeet(by,why){
 HS.phase='meet';HS.votes={};HS.by=by;
 bcast({t:'meet',by:by,why:why,al:Object.keys(HS.p).filter(function(k){return HS.p[k].alive}),T:25});
 clearTimeout(HS.mt);HS.mt=setTimeout(tally,25500);
}
function tally(){
 if(HS.phase!=='meet')return;clearTimeout(HS.mt);HS.phase='res';
 var c={},top=null,tv=0,tie=false,skip=0;
 Object.keys(HS.votes).forEach(function(k){var v=HS.votes[k];if(v==='skip')skip++;else{c[v]=(c[v]||0)+1}});
 Object.keys(c).forEach(function(k){if(c[k]>tv){tv=c[k];top=k;tie=false}else if(c[k]===tv)tie=true});
 var out=(!tie&&top&&tv>skip)?top:null;
 if(out)HS.p[out].alive=false;
 bcast({t:'res',out:out,imp:out?HS.p[out].role==='imp':null});
 setTimeout(function(){
  if(!HS)return;if(!checkWin())return;
  HS.bodies=[];var ids=Object.keys(HS.p),n=0;
  ids.forEach(function(k){var p=HS.p[k];var a=n++/ids.length*Math.PI*2;p.x=TBL[0]+Math.cos(a)*70;p.y=TBL[1]+Math.sin(a)*70;p.cd=Date.now()+HS.cfg.cooldown});
  HS.phase='play';bcast({t:'resume'});
 },4000);
}
function checkWin(){
 var imp=0,crew=0;Object.keys(HS.p).forEach(function(k){var p=HS.p[k];if(p.alive){p.role==='imp'?imp++:crew++}});
 if(imp===0){endGame('crew');return false}
 if(imp>=crew){endGame('imp');return false}
 return true;
}
function endGame(w){
 if(!HS||HS.phase==='end')return;HS.phase='end';clearInterval(HS.t);clearTimeout(HS.mt);
 var r={};Object.keys(HS.p).forEach(function(k){r[k]=HS.p[k].role});
 bcast({t:'end',w:w,r:r});HS=null;
}
$('again').onclick=function(){bcast({t:'lobby',P:P})};

/* ---------- client logic ---------- */
function onMsg(m){
 if(m.t==='welcome'){me=m.id}

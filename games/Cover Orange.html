<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cover Orange</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080808; }
    body { display: grid; place-items: center; }
    #game { width: 100vw; height: 100dvh; display: grid; place-items: center; }
    ruffle-player { display: block; width: 100%; height: 100%; background: #080808; }
    #status { position: fixed; inset: auto 12px 12px; color: #ddd; font: 14px system-ui,sans-serif; text-align: center; pointer-events: none; }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      splashScreen: false,
      letterbox: "on",
      warnOnUnsupportedContent: false
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
  <main id="game" aria-label="Cover Orange game"></main>
  <div id="status">Loading Cover Orange…</div>
  <script>
    (() => {
      const host = document.getElementById("game");
      const status = document.getElementById("status");
      const aspect = 1.8333333333333333;
      function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        let width = w, height = width / aspect;
        if (height > h) { height = h; width = height * aspect; }
        host.style.width = Math.floor(width) + "px";
        host.style.height = Math.floor(height) + "px";
      }
      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("orientationchange", () => setTimeout(resize, 150), { passive: true });
      resize();
      function start() {
        const api = window.RufflePlayer && window.RufflePlayer.newest();
        if (!api) {
          status.textContent = "The Flash player could not load. Check your connection and refresh.";
          return;
        }
        const player = api.createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";
        host.appendChild(player);
        player.load("https://cdn.jsdelivr.net/gh/Stinkalistic/UGS@main/SWFs/coverorange.swf").then(() => {
          status.textContent = "";
        }).catch((error) => {
          console.error("Game load failed:", error);
          status.textContent = "The game failed to load. Please refresh and try again.";
        });
        setTimeout(() => { if (status.textContent.startsWith("Loading")) status.textContent = ""; }, 12000);
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once: true });
      else start();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b14">
<title>Jetpack Joyride</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b14;color:#fff;font-family:Arial,sans-serif}
iframe{display:block;width:100%;height:100%;border:0;background:#080b14}
.fallback{position:fixed;z-index:2;left:8px;right:8px;bottom:8px;text-align:center;font-size:12px;color:#ddd;text-shadow:0 1px 3px #000;pointer-events:none}
.fallback a{pointer-events:auto;color:#8de8ff}
</style>
</head>
<body>
<iframe src="https://ishwarbb.github.io/JetpackJoyride/" title="Jetpack Joyride browser game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
<div class="fallback">If the game doesn't load, <a href="https://ishwarbb.github.io/JetpackJoyride/" target="_blank" rel="noopener">open it directly</a>.</div>
</body>
</html>

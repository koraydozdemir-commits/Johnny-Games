<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080910">
<title>Veck.io · Johnny Games</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060b;color:#fff;font-family:Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{height:100%;display:flex;flex-direction:column}.bar{height:48px;min-height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#10111c;border-bottom:1px solid #ffffff20;font-size:13px;font-weight:800}
.bar b{white-space:nowrap}.bar span{flex:1;min-width:0;opacity:.72;font-weight:600;font-size:11px}
.bar a{color:#d1c4ff;text-decoration:none;padding:8px 11px;border:1px solid #ffffff25;border-radius:9px;white-space:nowrap}
.player{position:relative;flex:1;min-height:0;background:#000}.player iframe{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#000}
@media(max-width:520px){.bar{height:44px;min-height:44px;padding:0 8px;gap:7px}.bar span{font-size:9px}.bar a{font-size:11px;padding:7px 8px}}
</style>
</head>
<body><main>
<header class="bar"><b>Veck.io</b><span>Official game · Play inside Johnny Games</span><a href="https://veck.io/" target="_blank" rel="noopener noreferrer">Open game ↗</a></header>
<section class="player"><iframe src="https://veck.io/" title="Veck.io" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope; pointer-lock; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></section>
</main></body></html>

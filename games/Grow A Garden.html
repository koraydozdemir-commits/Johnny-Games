async function mergeUnityWebFiles(baseUrl, filePrefix, totalParts, extension, onProgress) {
  const partUrls = Array.from({ length: totalParts }, (_, i) => `${baseUrl}/${filePrefix}${i + 1}.${extension}`);
  let totalSize = 0;

  for (const url of partUrls) {
    const head = await fetch(url, { method: "HEAD" });
    const len = head.headers.get("Content-Length");
    if (len) totalSize += parseInt(len, 10);
  }

  const buffers = [];
  let downloaded = 0;

  for (const url of partUrls) {
    const res = await fetch(url);
    const reader = res.body.getReader();
    const chunks = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      downloaded += value.length;
      onProgress && onProgress(downloaded / totalSize * 0.5);
    }

    const full = new Uint8Array(chunks.reduce((a, b) => a + b.length, 0));
    let offset = 0;
    for (const chunk of chunks) { full.set(chunk, offset); offset += chunk.length; }
    buffers.push(full);
  }

  const final = new Uint8Array(buffers.reduce((a, b) => a + b.byteLength, 0));
  let offset = 0;
  for (const b of buffers) { final.set(b, offset); offset += b.byteLength; }
  return final;
}

<!--

  KEY_SCHEME is set to 'wasd' as a best guess (Grow a Garden clones usually use WASD).
  If dragging the stick does nothing on your phone, change KEY_SCHEME below to 'arrows'
  and reload. That's the only thing likely to need adjusting.
-->

<div id="vjoy-base"><div id="vjoy-stick"></div></div>

<script>
(function () {
  'use strict';

  var KEY_SCHEME = 'wasd'; // flip to 'arrows' if wasd doesn't move the character

  var SCHEMES = {
    arrows: {
      up:    { key: 'ArrowUp',    code: 'ArrowUp',    keyCode: 38 },
      down:  { key: 'ArrowDown',  code: 'ArrowDown',  keyCode: 40 },
      left:  { key: 'ArrowLeft',  code: 'ArrowLeft',  keyCode: 37 },
      right: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 }
    },
    wasd: {
      up:    { key: 'w', code: 'KeyW', keyCode: 87 },
      down:  { key: 's', code: 'KeyS', keyCode: 83 },
      left:  { key: 'a', code: 'KeyA', keyCode: 65 },
      right: { key: 'd', code: 'KeyD', keyCode: 68 }
    }
  };
  var keys = SCHEMES[KEY_SCHEME];

  var base = document.getElementById('vjoy-base');
  var stick = document.getElementById('vjoy-stick');
  var activeDirs = {};
  var touchId = null;

  function fireKey(type, dir) {
    var k = keys[dir];
    if (!k) return;
    var opts = {
      key: k.key, code: k.code, keyCode: k.keyCode, which: k.keyCode,
      bubbles: true, cancelable: true
    };
    var targets = [document, window];
    var canvas = document.querySelector('canvas');
    if (canvas) targets.push(canvas);
    var ruffle = document.querySelector('ruffle-player');
    if (ruffle) targets.push(ruffle);
    for (var i = 0; i < targets.length; i++) {
      targets[i].dispatchEvent(new KeyboardEvent(type, opts));
    }
  }

  function setDirections(newDirs) {
    var dir;
    for (dir in activeDirs) {
      if (activeDirs[dir] && !newDirs[dir]) fireKey('keyup', dir);
    }
    for (dir in newDirs) {
      if (newDirs[dir] && !activeDirs[dir]) fireKey('keydown', dir);
    }
    activeDirs = newDirs;
  }

  function handleMove(clientX, clientY) {
    var rect = base.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = clientX - cx;
    var dy = clientY - cy;
    var maxDist = rect.width / 2;
    var rawDist = Math.hypot(dx, dy);
    var dist = Math.min(rawDist, maxDist);
    var angle = Math.atan2(dy, dx);

    stick.style.left = (35 + Math.cos(angle) * dist - 15) + 'px';
    stick.style.top = (35 + Math.sin(angle) * dist - 15) + 'px';

    var newDirs = {};
    var deadzone = maxDist * 0.25;
    if (rawDist > deadzone) {
      var deg = angle * 180 / Math.PI;
      if (deg > -135 && deg < -45) newDirs.up = true;
      else if (deg > 45 && deg < 135) newDirs.down = true;
      if (deg > 135 || deg < -135) newDirs.left = true;
      else if (deg > -45 && deg < 45) newDirs.right = true;
    }
    setDirections(newDirs);
  }

  function reset() {
    stick.style.left = '35px';
    stick.style.top = '35px';
    setDirections({});
  }

  base.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    touchId = t.identifier;
    handleMove(t.clientX, t.clientY);
  }, { passive: false });

  base.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === touchId) handleMove(t.clientX, t.clientY);
    }
  }, { passive: false });

  base.addEventListener('touchend', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === touchId) {
        touchId = null;
        reset();
      }
    }
  }, { passive: false });
})();
</script>

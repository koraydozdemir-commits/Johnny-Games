<!DOCTYPE html>



<!-- Ultimate Game Stash file--> 
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->



<html lang="en-us">
<base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/sort-court/">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Sort the Court!</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="shortcut icon" href="TemplateData/favicon.ico" />
  <style>
    html, body { margin: 0; width: 100%; min-height: 100%; background: #000; }
    body.template { box-sizing: border-box; overflow: auto; -webkit-text-size-adjust: 100%; }
    .template-wrap { box-sizing: border-box; width: 100%; max-width: 960px; margin: 0 auto; }
    #mobile-controls { display: none; }
    #canvas.emscripten { display: block; width: min(100%, 960px, calc((100dvh - 24px) * 1.7777778)) !important; height: auto !important; aspect-ratio: 16 / 9; margin: 0 auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    @media (max-width: 700px) {
      html, body { min-height: 100dvh; }
      body.template { display: flex; flex-direction: column; justify-content: center; overflow: hidden; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
      .header, .footer { display: none !important; }
      .template-wrap { width: 100%; max-width: none; margin: 0; }
      #mobile-controls { display: flex; justify-content: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 12px 14px max(12px, env(safe-area-inset-bottom)); }
      #mobile-controls button { flex: 1; max-width: 180px; min-height: 58px; border: 2px solid rgba(255,255,255,.75); border-radius: 12px; background: #292929; color: white; font: 800 17px/1 Arial,sans-serif; letter-spacing: .5px; box-shadow: 0 4px 0 #111; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      #mobile-controls button:active { transform: translateY(3px); box-shadow: 0 1px 0 #111; background: #555; }
      #canvas.emscripten { width: min(100vw, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 1.7777778)) !important; max-width: 100vw; }
      .fullscreen { position: fixed; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 10; }
      .fullscreen img { width: 32px; height: 32px; }
      .title, .logo { display: none !important; }
    }
  </style>
  <script src="TemplateData/UnityProgress.js"></script>
</head>

<body class="template">
  <p class="header"><span>Unity WebGL Player | </span>Sort the Court!</p>
  <div class="template-wrap clear">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" height="540px" width="960px"></canvas>
    <div id="mobile-controls" aria-label="Touch controls">
      <button type="button" data-key="y">YES</button>
      <button type="button" data-key="space">CONTINUE</button>
      <button type="button" data-key="n">NO</button>
    </div>
    <div class="logo"></div>
    <div class="fullscreen"><img src="TemplateData/fullscreen.png" width="38" height="38" alt="Fullscreen" title="Fullscreen" onclick="SetFullscreen(1);" /></div>
    <div class="title">Sort the Court!</div>
  </div>
  <p class="footer">&laquo; created with <a href="http://unity3d.com/" title="Go to unity3d.com">Unity</a> &raquo;</p>
  <script type='text/javascript'>
    var Module = {
      TOTAL_MEMORY: 268435456,
      errorhandler: null, // arguments: err, url, line. This function must return 'true' if the error is handled, otherwise 'false'
      compatibilitycheck: null,
      dataUrl: "Release/WebGL.data",
      codeUrl: "Release/WebGL.js",
      memUrl: "Release/WebGL.mem",
    };
  </script>
  <script>
    (function () {
      var controls = document.getElementById('mobile-controls');
      if (!controls) return;
      controls.addEventListener('pointerdown', function (event) {
        var button = event.target.closest('button[data-key]');
        if (!button) return;
        event.preventDefault();
        var value = button.getAttribute('data-key');
        var key = value === 'space' ? ' ' : value.toUpperCase();
        var code = value === 'space' ? 'Space' : 'Key' + value.toUpperCase();
        var keyCode = value === 'space' ? 32 : (value === 'y' ? 89 : 78);
        var canvas = document.getElementById('canvas');
        if (canvas) canvas.focus();
        function send(type) {
          var ev = new KeyboardEvent(type, { key: key, code: code, bubbles: true, cancelable: true });
          try { Object.defineProperty(ev, 'keyCode', { get: function () { return keyCode; } }); } catch (_) {}
          try { Object.defineProperty(ev, 'which', { get: function () { return keyCode; } }); } catch (_) {}
          window.dispatchEvent(ev);
          document.dispatchEvent(new KeyboardEvent(type, { key: key, code: code, bubbles: true, cancelable: true }));
        }
        send('keydown');
        window.setTimeout(function () { send('keyup'); }, 90);
      });
    })();
  </script>
  <script src="Release/UnityLoader.js"></script>

</body>

</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071817">
<title>Online Mini Golf | Johnny Games</title>
<style>
:root{color-scheme:dark;--lime:#c8f36a;--ink:#f7f8f3;--muted:#b4c9bf;--line:#284741}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071817;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{height:100dvh;min-height:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{flex:none;display:flex;align-items:center;gap:12px;padding:9px 14px;background:#0b201f;border-bottom:1px solid var(--line);min-height:60px}
.logo{width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--lime);color:#172219;border-radius:12px;font-size:23px}
.brand{flex:1;min-width:0}h1{font-size:clamp(17px,3vw,23px);margin:0;letter-spacing:-.6px}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
a.btn,button.btn{appearance:none;border:0;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:800 12px system-ui;padding:10px 12px;border-radius:10px;background:var(--lime);color:#172219;cursor:pointer;white-space:nowrap}
a.btn.secondary,button.btn.secondary{background:#203d38;color:#eff8f0;border:1px solid #36564d}
main{flex:1;min-height:0;display:flex;padding:8px;background:#071817}
.framewrap{position:relative;flex:1;min-width:0;min-height:0;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#102725}
iframe{display:block;width:100%;height:100%;border:0;background:#102725}
footer{flex:none;display:flex;justify-content:center;align-items:center;gap:12px;padding:5px 12px calc(5px + env(safe-area-inset-bottom));background:#0b201f;color:var(--muted);font-size:11px}
footer a{color:var(--lime);text-decoration:none;font-weight:700}
@media(max-width:560px){header{padding:7px 9px;gap:8px;min-height:54px}.logo{width:34px;height:34px;font-size:20px}.sub{display:none}.actions{gap:5px}.actions .btn{font-size:10px;padding:9px 8px}main{padding:4px}.framewrap{border-radius:8px}footer{font-size:10px}}
@media(max-height:430px){header{min-height:42px;padding:4px 8px}.logo{width:30px;height:30px}.sub{display:none}main{padding:3px}footer{display:none}}
</style>
</head>
<body>
<header>
 <div class="logo" aria-hidden="true">⛳</div>
 <div class="brand"><h1>ONLINE MINI GOLF</h1><div class="sub">Penguin Mini Golf · Play solo or invite friends</div></div>
 <nav class="actions" aria-label="Game actions">
  <a class="btn" href="https://foony.com/games/mini-golf" target="_blank" rel="noopener noreferrer">OPEN GAME ↗</a>
  <a class="btn secondary" href="Mini%20Golf%20Classic.html">SOLO CLASSIC</a>
  <button class="btn secondary" id="fullscreen" type="button">FULLSCREEN ⛶</button>
 </nav>
</header>
<main>
 <section class="framewrap" aria-label="Penguin Mini Golf">
  <iframe id="game" title="Foony Penguin Mini Golf" src="https://foony.com/games/mini-golf" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
 </section>
</main>
<footer>
 <span>Free browser game · Create a room and share its link to play with friends</span>
 <a href="https://foony.com/games/mini-golf" target="_blank" rel="noopener noreferrer">If the game is blocked here, open it directly</a>
</footer>
<script>
(()=>{const frame=document.getElementById('game'),button=document.getElementById('fullscreen');button.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(frame.requestFullscreen)await frame.requestFullscreen();else if(frame.webkitEnterFullscreen)frame.webkitEnterFullscreen();}catch(_){window.open('https://foony.com/games/mini-golf','_blank','noopener');}});})();
</script>
</body>
</html>

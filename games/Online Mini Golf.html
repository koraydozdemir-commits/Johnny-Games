<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071817">
<title>Online Mini Golf | Johnny Games</title>
<style>
:root{color-scheme:dark;--lime:#c8f36a;--ink:#f7f8f3;--muted:#b4c9bf;--line:#284741}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071817;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{height:100dvh;min-height:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{flex:none;display:flex;align-items:center;gap:12px;padding:8px 13px;background:#0b201f;border-bottom:1px solid var(--line);min-height:56px}
.logo{width:38px;height:38px;flex:none;display:grid;place-items:center;background:var(--lime);color:#172219;border-radius:12px;font-size:22px}
.brand{flex:1;min-width:0}h1{font-size:clamp(17px,3vw,22px);margin:0;letter-spacing:-.5px}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:7px;align-items:center}
a.btn,button.btn{appearance:none;border:0;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:800 12px system-ui;padding:10px 12px;border-radius:10px;background:var(--lime);color:#172219;cursor:pointer;white-space:nowrap}
a.btn.secondary,button.btn.secondary{background:#203d38;color:#eff8f0;border:1px solid #36564d}
main{flex:1;min-height:0;display:flex;padding:7px;background:#071817}
.framewrap{position:relative;flex:1;min-width:0;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#102725}
iframe{display:block;width:100%;height:100%;border:0;background:#071817}
footer{flex:none;display:flex;justify-content:center;align-items:center;padding:5px 10px calc(5px + env(safe-area-inset-bottom));background:#0b201f;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:560px){header{padding:6px 8px;gap:7px;min-height:49px}.logo{width:32px;height:32px;font-size:19px}.sub{display:none}.actions{gap:5px}.actions .btn{font-size:10px;padding:9px 8px}main{padding:3px}.framewrap{border-radius:7px}footer{font-size:10px}}
@media(max-height:430px){header{min-height:40px;padding:3px 7px}.logo{width:28px;height:28px}.sub{display:none}main{padding:2px}footer{display:none}}
</style>
</head>
<body>
<header>
 <div class="logo" aria-hidden="true">⛳</div>
 <div class="brand"><h1>ONLINE MINI GOLF</h1><div class="sub">Johnny Games · Built-in browser course</div></div>
 <nav class="actions" aria-label="Game actions">
  <a class="btn secondary" href="Mini%20Golf%20Classic.html" target="_blank" rel="noopener">OPEN GAME ↗</a>
  <button class="btn" id="fullscreen" type="button">FULLSCREEN ⛶</button>
 </nav>
</header>
<main>
 <section class="framewrap" aria-label="Johnny Games mini golf">
  <iframe id="game" title="Johnny Games Mini Golf" src="Mini%20Golf%20Classic.html" allow="fullscreen; autoplay; gamepad" allowfullscreen loading="eager"></iframe>
 </section>
</main>
<footer>This version runs directly from Johnny Games — no third-party game embed required.</footer>
<script>
(()=>{const frame=document.getElementById('game'),button=document.getElementById('fullscreen');button.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await frame.requestFullscreen();}catch(_){window.open('Mini%20Golf%20Classic.html','_blank','noopener');}});})();
</script>
</body>
</html>

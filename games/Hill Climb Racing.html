  <script
    src="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/ytgame.js">
  </script>


  <!-- =====================================================
       LOCAL SAVE PATCH
       ===================================================== -->

  <script>

    (function () {

      "use strict";

      const SAVE_KEY = "HCR_LITE_SAVE";

      console.log("[HCR SAVE] Save system starting...");


      /*
       * ----------------------------------------------------
       * LOCAL STORAGE
       * ----------------------------------------------------
       */

      function saveLocal(data) {

        try {

          if (data === undefined || data === null) {
            console.warn("[HCR SAVE] Nothing to save.");
            return;
          }

          let saveData;

          /*
           * Playables games can pass either a string
           * or an object.
           */

          if (typeof data === "string") {
            saveData = data;
          } else {
            saveData = JSON.stringify(data);
          }

          localStorage.setItem(SAVE_KEY, saveData);

          console.log(
            "[HCR SAVE] Successfully saved:",
            saveData
          );

        } catch (error) {

          console.error(
            "[HCR SAVE] Save failed:",
            error
          );

        }

      }


      function loadLocal() {

        try {

          const data =
            localStorage.getItem(SAVE_KEY);

          if (!data) {

            console.log(
              "[HCR SAVE] No save found."
            );

            return null;

          }

          console.log(
            "[HCR SAVE] Save found."
          );

          /*
           * Try JSON first.
           */

          try {

            return JSON.parse(data);

          } catch {

            /*
             * Otherwise return the raw string.
             */

            return data;

          }

        } catch (error) {

          console.error(
            "[HCR SAVE] Load failed:",
            error
          );

          return null;

        }

      }


      /*
       * ----------------------------------------------------
       * WAIT FOR YTGAME
       * ----------------------------------------------------
       *
       * ytgame.js may initialize its game object
       * asynchronously, so don't patch it only once.
       */

      function installSavePatch() {

        if (
          !window.ytgame ||
          !window.ytgame.game
        ) {

          console.log(
            "[HCR SAVE] Waiting for ytgame..."
          );

          setTimeout(
            installSavePatch,
            50
          );

          return;

        }


        const game = window.ytgame.game;


        /*
         * Don't install the patch twice.
         */

        if (game.__HCR_LOCAL_SAVE_PATCHED) {
          return;
        }

        game.__HCR_LOCAL_SAVE_PATCHED = true;


        console.log(
          "[HCR SAVE] Installing local save patch..."
        );


        /*
         * ------------------------------------------------
         * SAVE
         * ------------------------------------------------
         */

        const originalSaveData =
          typeof game.saveData === "function"
            ? game.saveData.bind(game)
            : null;


        game.saveData = function (data) {

          console.log(
            "[HCR SAVE] saveData() called."
          );

          /*
           * Save to GitHub site's browser storage.
           */

          saveLocal(data);


          /*
           * Also let the original Playables
           * save function run if available.
           */

          if (originalSaveData) {

            try {

              return originalSaveData(data);

            } catch (error) {

              console.warn(
                "[HCR SAVE] Original save failed:",
                error
              );

            }

          }

          return Promise.resolve();

        };


        /*
         * ------------------------------------------------
         * LOAD
         * ------------------------------------------------
         */

        const originalLoadData =
          typeof game.loadData === "function"
            ? game.loadData.bind(game)
            : null;


        game.loadData = function () {

          console.log(
            "[HCR SAVE] loadData() called."
          );


          const localSave =
            loadLocal();


          /*
           * If we have a local save,
           * give it back to the game.
           */

          if (localSave !== null) {

            console.log(
              "[HCR SAVE] Loading local save."
            );

            return Promise.resolve(
              localSave
            );

          }


          /*
           * No local save yet.
           * Try the original Playables API.
           */

          if (originalLoadData) {

            try {

              return originalLoadData();

            } catch (error) {

              console.warn(
                "[HCR SAVE] Original load failed:",
                error
              );

            }

          }


          return Promise.resolve(null);

        };


        console.log(
          "[HCR SAVE] Local save patch installed!"
        );

      }


      installSavePatch();


      /*
       * ----------------------------------------------------
       * DEBUG FUNCTIONS
       * ----------------------------------------------------
       *
       * These are useful for testing from the browser
       * console.
       */

      window.HCRSave = {

        get: function () {

          return loadLocal();

        },

        clear: function () {

          localStorage.removeItem(
            SAVE_KEY
          );

          console.log(
            "[HCR SAVE] Save deleted."
          );

        },

        exists: function () {

          return (
            localStorage.getItem(
              SAVE_KEY
            ) !== null
          );

        }

      };

    })();

  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@ed57fd6dbc91143221b05fdf61be73bacc375843/hill-climb-racing-lite/">

  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- =========================================================
       LOCAL SAVE SYSTEM
       ========================================================= -->

  <script>
    (function () {
      "use strict";

      const SAVE_KEY = "hcr_lite_save_data";

      // ---------------------------------------------------------
      // Local storage helpers
      // ---------------------------------------------------------

      function saveToLocalStorage(data) {
        try {
          if (data === undefined || data === null) return;

          let value;

          if (typeof data === "string") {
            value = data;
          } else {
            value = JSON.stringify(data);
          }

          localStorage.setItem(SAVE_KEY, value);

          console.log("[HCR Save] Game data saved locally.");
        } catch (error) {
          console.warn("[HCR Save] Could not save data:", error);
        }
      }

      function loadFromLocalStorage() {
        try {
          const value = localStorage.getItem(SAVE_KEY);

          if (value === null) {
            console.log("[HCR Save] No previous save found.");
            return null;
          }

          console.log("[HCR Save] Save data loaded.");

          // Try to restore JSON data.
          try {
            return JSON.parse(value);
          } catch (e) {
            // If the game expects a string, return it unchanged.
            return value;
          }

        } catch (error) {
          console.warn("[HCR Save] Could not load data:", error);
          return null;
        }
      }

      // ---------------------------------------------------------
      // Expose save functions globally
      // ---------------------------------------------------------

      window.HCRSave = {
        save: saveToLocalStorage,
        load: loadFromLocalStorage,

        clear: function () {
          try {
            localStorage.removeItem(SAVE_KEY);
            console.log("[HCR Save] Save deleted.");
          } catch (error) {
            console.warn("[HCR Save] Could not delete save:", error);
          }
        }
      };

      // ---------------------------------------------------------
      // Playables API compatibility layer
      // ---------------------------------------------------------

      // Create a temporary compatibility object if ytgame.js
      // has not created one yet.
      window.ytgame = window.ytgame || {};
      window.ytgame.game = window.ytgame.game || {};

      const game = window.ytgame.game;

      // Preserve any existing functions.
      const originalSaveData = game.saveData;
      const originalLoadData = game.loadData;

      game.saveData = function (data) {

        // Save locally first.
        saveToLocalStorage(data);

        // If the original Playables API exists,
        // allow it to run as well.
        if (typeof originalSaveData === "function") {
          try {
            return originalSaveData.call(this, data);
          } catch (error) {
            console.warn(
              "[HCR Save] Original saveData failed:",
              error
            );
          }
        }

        return Promise.resolve();
      };

      game.loadData = function () {

        const localData = loadFromLocalStorage();

        // If we have local data, return it.
        if (localData !== null) {
          return Promise.resolve(localData);
        }

        // Otherwise allow the original Playables API to load.
        if (typeof originalLoadData === "function") {
          try {
            return originalLoadData.call(this);
          } catch (error) {
            console.warn(
              "[HCR Save] Original loadData failed:",
              error
            );
          }
        }

        return Promise.resolve(null);
      };

      // ---------------------------------------------------------
      // Backup automatic save
      // ---------------------------------------------------------

      // This does NOT invent game data.
      // It only saves data when the game exposes it through
      // the Playables save system.
      window.addEventListener("beforeunload", function () {
        console.log("[HCR Save] Leaving game.");
      });

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") {
          console.log("[HCR Save] Page hidden.");
        }
      });

    })();
  </script>

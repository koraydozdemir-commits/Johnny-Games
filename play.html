<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b14">
<title>Johnny Games · Play</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#fff;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tb{flex:0 0 52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#0b0b14;border-bottom:1px solid #2a2a40}
.tb.hide{display:none}
.tb a,.tb button{min-width:44px;height:44px;padding:0 14px;border-radius:12px;border:1px solid #2a2a40;background:#161624;
 color:#fff;font:600 15px inherit;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.tb .t{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fav.on{color:#ff4d6d}
#wrap{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#show{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:5;width:44px;height:44px;border-radius:50%;
 border:0;background:rgba(0,0,0,.5);color:#fff;font-size:18px;display:none}
#show.on{display:block}
.err{padding:40px;text-align:center}

/* Johnny Games player polish */
html,body{background:#070811}
body{background:radial-gradient(ellipse at 50% -30%,rgba(102,78,210,.2),transparent 55%),#070811}
.tb{
 flex-basis:58px;gap:9px;padding:0 clamp(10px,2vw,22px);
 border-bottom:1px solid rgba(255,255,255,.12);
 background:rgba(10,11,21,.86);box-shadow:0 8px 28px rgba(0,0,0,.28);
 backdrop-filter:blur(20px) saturate(130%);
}
.tb a,.tb button{
 min-width:44px;height:42px;padding:0 13px;border:1px solid rgba(255,255,255,.14);
 border-radius:12px;background:rgba(255,255,255,.07);color:#f7f5ff;
 font-size:13px;font-weight:750;transition:transform .18s,border-color .18s,background .18s;
}
.tb a:hover,.tb button:hover{transform:translateY(-1px);border-color:rgba(180,160,255,.55);background:rgba(140,116,255,.15)}
.tb .t{padding:0 8px;color:#eae6fb;font-size:14px;font-weight:800;letter-spacing:.01em}
#fav.on{color:#ff7d9e;border-color:rgba(255,125,158,.35);background:rgba(255,89,132,.1)}
#wrap{background:#000}
#wrap iframe{background:#000}
#show{
 top:calc(10px + env(safe-area-inset-top));right:10px;width:46px;height:46px;
 border:1px solid rgba(255,255,255,.2);background:rgba(12,12,23,.8);
 box-shadow:0 8px 26px rgba(0,0,0,.35);backdrop-filter:blur(16px);
}
.err{color:#eae6fb;font-size:15px}
.err a{color:#b8a6ff!important;text-decoration:none}
@media(max-width:600px){
 .tb{flex-basis:54px;gap:6px;padding-inline:7px}
 .tb a,.tb button{min-width:40px;height:40px;padding:0 10px;border-radius:11px}
 .tb .t{font-size:12px}
}

</style>
</head>
<body>
<div class="tb" id="tb">
 <a href="index.html" aria-label="Back to all games">&larr; Home</a>
 <span class="t" id="title"></span>
 <button id="fav" aria-label="Favorite">&#9825;</button>
 <button id="reload" aria-label="Reload game">&#8635;</button>
 <button id="full" aria-label="Fullscreen">&#9974;</button>
</div>
<div id="wrap"></div>
<button id="show" aria-label="Show menu bar">&#9776;</button>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var store={
 get:function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
 set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var ANALYTICS_API='https://wnxauvllhjklhpjksvuz.supabase.co/functions/v1/site-analytics';
var visitor='';
try{visitor=localStorage.getItem('jg_analytics_visitor')||''}catch(e){}
if(!visitor){visitor=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'v'+Date.now().toString(36)+Math.random().toString(36).slice(2);try{localStorage.setItem('jg_analytics_visitor',visitor)}catch(e){}}
function sendAnalytics(event){try{fetch(ANALYTICS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(event),keepalive:true}).catch(function(){});}catch(e){}}
var name=new URLSearchParams(location.search).get('g')||'';
// Only plain game names, no path tricks.
if(!name||/[\/\\]|\.\./.test(name)){
 $('wrap').innerHTML='<p class="err">No game selected. <a href="index.html" style="color:#9d86ff">Back to games</a></p>';
 $('tb').style.display='none';return;
}
document.title=name+' · Johnny Games';
$('title').textContent=name;
var src='games/'+encodeURIComponent(name)+'.html';
// Cache-bust the multiplayer mini-golf launcher so browsers don't keep showing the old solo game.
if(name==='Online Mini Golf') src+='?v=multiplayer-20261025';

function load(){
 var w=$('wrap');w.innerHTML='';
 var f=document.createElement('iframe');
 f.src=src;f.title=name;
 f.setAttribute('allow','fullscreen; autoplay; gamepad; accelerometer; gyroscope');
 f.setAttribute('allowfullscreen','');
 w.appendChild(f);
 sendAnalytics({type:'play',game:name});
}
load();

// Recently played
var rec=store.get('jg_recent',[]).filter(function(n){return n!==name});
rec.unshift(name);store.set('jg_recent',rec.slice(0,12));

// Favorite
function paintFav(){
 var on=store.get('jg_favs',[]).indexOf(name)>-1;
 $('fav').className=on?'on':'';$('fav').innerHTML=on?'&#9829;':'&#9825;';
}
$('fav').onclick=function(){
 var f=store.get('jg_favs',[]),i=f.indexOf(name);
 if(i<0)f.push(name);else f.splice(i,1);
 store.set('jg_favs',f);paintFav();
 sendAnalytics({type:'favorite',game:name,visitor:visitor,active:i<0});
};
paintFav();

$('reload').onclick=load;

// Fullscreen: real API where Safari allows it, otherwise just hide the bar.
function hideBar(h){$('tb').classList.toggle('hide',h);$('show').classList.toggle('on',h)}
$('full').onclick=function(){
 var el=document.documentElement;
 var req=el.requestFullscreen||el.webkitRequestFullscreen;
 if(req&&!document.fullscreenElement&&!document.webkitFullscreenElement){
  try{var p=req.call(el);if(p&&p.catch)p.catch(function(){})}catch(e){}
 }
 hideBar(true);
};
$('show').onclick=function(){
 var ex=document.exitFullscreen||document.webkitExitFullscreen;
 if(ex&&(document.fullscreenElement||document.webkitFullscreenElement)){try{ex.call(document)}catch(e){}}
 hideBar(false);
};
})();
</script>
</body>
</html>

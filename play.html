<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b14">
<title>Play</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#fff;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tb{flex:0 0 52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#0b0b14;border-bottom:1px solid #2a2a40}
.tb.hide{display:none}
.tb a,.tb button{min-width:44px;height:44px;padding:0 14px;border-radius:12px;border:1px solid #2a2a40;background:#161624;
 color:#fff;font:600 15px inherit;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.tb .t{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fav.on{color:#ff4d6d}
#wrap{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#show{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:5;width:44px;height:44px;border-radius:50%;
 border:0;background:rgba(0,0,0,.5);color:#fff;font-size:18px;display:none}
#show.on{display:block}
.err{padding:40px;text-align:center}
</style>
</head>
<body>
<div class="tb" id="tb">
 <a href="index.html" aria-label="Back to all games">&larr; Home</a>
 <span class="t" id="title"></span>
 <button id="fav" aria-label="Favorite">&#9825;</button>
 <button id="reload" aria-label="Reload game">&#8635;</button>
 <button id="full" aria-label="Fullscreen">&#9974;</button>
</div>
<div id="wrap"></div>
<button id="show" aria-label="Show menu bar">&#9776;</button>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var store={
 get:function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
 set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var name=new URLSearchParams(location.search).get('g')||'';
// Only plain game names, no path tricks.
if(!name||/[\/\\]|\.\./.test(name)){
 $('wrap').innerHTML='<p class="err">No game selected. <a href="index.html" style="color:#9d86ff">Back to games</a></p>';
 $('tb').style.display='none';return;
}
document.title=name;
$('title').textContent=name;
var src='games/'+encodeURIComponent(name)+'.html';

function load(){
 var w=$('wrap');w.innerHTML='';
 var f=document.createElement('iframe');
 f.src=src;f.title=name;
 f.setAttribute('allow','fullscreen; autoplay; gamepad; accelerometer; gyroscope');
 f.setAttribute('allowfullscreen','');
 w.appendChild(f);
}
load();

// Recently played
var rec=store.get('jg_recent',[]).filter(function(n){return n!==name});
rec.unshift(name);store.set('jg_recent',rec.slice(0,12));

// Favorite
function paintFav(){
 var on=store.get('jg_favs',[]).indexOf(name)>-1;
 $('fav').className=on?'on':'';$('fav').innerHTML=on?'&#9829;':'&#9825;';
}
$('fav').onclick=function(){
 var f=store.get('jg_favs',[]),i=f.indexOf(name);
 if(i<0)f.push(name);else f.splice(i,1);
 store.set('jg_favs',f);paintFav();
};
paintFav();

$('reload').onclick=load;

// Fullscreen: real API where Safari allows it, otherwise just hide the bar.
function hideBar(h){$('tb').classList.toggle('hide',h);$('show').classList.toggle('on',h)}
$('full').onclick=function(){
 var el=document.documentElement;
 var req=el.requestFullscreen||el.webkitRequestFullscreen;
 if(req&&!document.fullscreenElement&&!document.webkitFullscreenElement){
  try{var p=req.call(el);if(p&&p.catch)p.catch(function(){})}catch(e){}
 }
 hideBar(true);
};
$('show').onclick=function(){
 var ex=document.exitFullscreen||document.webkitExitFullscreen;
 if(ex&&(document.fullscreenElement||document.webkitFullscreenElement)){try{ex.call(document)}catch(e){}}
 hideBar(false);
};
})();
</script>
</body>
</html>

name: Spore lint and tests
on:
  push:
    paths: ["games/spore/**", ".github/workflows/spore-lint.yml"]
  pull_request:
    paths: ["games/spore/**", ".github/workflows/spore-lint.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/spore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint
        run: npx --yes eslint@9 -c eslint.config.js .
      - name: Unit tests
        run: node --test tests/*.test.mjs

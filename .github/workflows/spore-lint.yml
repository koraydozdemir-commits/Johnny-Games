name: Spore lint and tests
on:
  push:
    paths: ["games/spore/**", ".github/workflows/spore-lint.yml"]
  pull_request:
    paths: ["games/spore/**", ".github/workflows/spore-lint.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/spore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint
        run: npx --yes eslint@9 -c eslint.config.js .
      - name: Install three.js for the tests (the game itself loads it from a CDN)
        run: npm install --no-save --no-package-lock three@0.160.0
      - name: Unit tests
        run: node --test tests/*.test.mjs
  browser:
    # Headless Chrome regression checks (dev/browser-check.mjs): the galaxy save screen, switching
    # species, heritage in the Civilization Stage, the minimap and world events, at three sizes;
    # and dev/editor-check.mjs: the creators driven with real touch gestures.
    # Software WebGL on CI runners is slow and occasionally flaky, so this job reports but doesn't block.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: games/spore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install three.js and playwright-core
        run: npm install --no-save --no-package-lock three@0.160.0 playwright-core@1
      - name: Browser checks
        run: CHROME=$(which google-chrome || which chromium) node dev/browser-check.mjs
      - name: Editor checks (touch gestures at phone, landscape, tablet and desktop sizes)
        run: CHROME=$(which google-chrome || which chromium) node dev/editor-check.mjs
